name: 強訊號警報
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      tw:
        description: '強制掃台股（1 = 要）'
        default: '0'
      test:
        description: '送一則測試訊息（1 = 要）'
        default: '1'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write   # 數據記錄要推回 data 分支
      actions: write    # 讓這一輪在中途先排好「下一輪」，輪與輪之間不留空窗
    # GitHub 的定時排程不準（實測起點間隔 40～80 分鐘），所以不靠它：
    #   1. 每一輪啟動後自己每 15 分鐘掃一次（夜間 30 分鐘）、連續約 38 分鐘；
    #   2. 第 2 次掃描開始時，用 workflow_dispatch 先排好「下一輪」（排在 concurrency 佇列，這一輪結束就立刻接上，中間只差啟動的幾十秒）；
    #   3. 定時排程（每 30 分鐘）只當備援：萬一接力斷掉，最慢下次排程時重新接上。
    # workflow_dispatch 事件即使用 GITHUB_TOKEN 發出也一定會建立新的 run（GitHub 官方文件）。
    concurrency:
      group: alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: |
          # 2026-11-08 搬遷：所有運算都在這裡跑（網站 Cloudflare 只讀結果）。每輪：警報 → 數據記錄 → 策略記錄 → 快照
          # 每次掃描目標間隔 15 分鐘（台北 01:00～08:59 為 30 分鐘；做完才算，掃描本身超過 10 分鐘就連續接著做）；新一次掃描最晚在這一輪的第 35 分鐘開始（一次掃描約 8～9 分鐘，整輪約 38 分鐘結束），
          # 確保 60 分鐘逾時前結束、把「推過哪些」存回快取（避免重複推播）
          START=$(date +%s); i=0; NEXT=0
          while true; do
            i=$((i+1)); T0=$(date +%s)
            # 第 2 次掃描開始時排好下一輪（只排一次）。test=0：不要送測試訊息
            if [ "$NEXT" = 0 ] && [ "$i" -ge 2 ]; then
              if gh workflow run alert.yml --ref "$GITHUB_REF_NAME" -f test=0 -f tw=0; then NEXT=1; echo "已排好下一輪"; else echo "::warning::排下一輪失敗，靠定時排程備援"; fi
            fi
            if [ "$i" = 1 ]; then TEST="$TEST_IN" TW="$TW_IN" timeout 600 node scripts/alert.mjs || true
            else timeout 600 node scripts/alert.mjs || true; fi
            timeout 300 node scripts/log.mjs || true
            timeout 400 node scripts/slog.mjs || true
            # 快照（加密一定跑；台股依時段／過期自動決定，也可手動 TW=1）
            TW="$TW_IN" timeout 1200 node scripts/snapshot.mjs || true
            ELAPSED=$(( $(date +%s) - T0 )); TOTAL=$(( $(date +%s) - START ))
            echo "第 $i 次掃描花 ${ELAPSED} 秒，這一輪已 ${TOTAL} 秒"
            # 台北時間 01:00～08:59 不推播（alert.mjs 的 quiet），網站也沒人看，降到每 30 分鐘一次，減少 Actions 占用；其餘時間每 15 分鐘
            H=$(TZ=Asia/Taipei date +%-H); INT=900; if [ "$H" -ge 1 ] && [ "$H" -lt 9 ]; then INT=1800; fi
            WAIT=$(( INT - ELAPSED )); [ "$WAIT" -lt 0 ] && WAIT=0
            # 下一次掃描如果要等到第 35 分鐘之後才開始，就不再等：這一輪到此結束，由已排好的下一輪接手
            # （先前把這個判斷放在 sleep 之後，夜間 30 分鐘間隔會睡過頭、撐到 60 分鐘逾時被取消）
            if [ $(( TOTAL + WAIT )) -gt 2100 ]; then break; fi
            sleep "$WAIT"
          done
        env:
          SNAPSHOT: '1'
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          SITE: ${{ vars.SITE }}
          TW_IN: ${{ github.event.inputs.tw }}
          TEST_IN: ${{ github.event.inputs.test }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
