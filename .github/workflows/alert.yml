name: 強訊號警報
on:
  schedule:
    # 台北 08:00～00:59（UTC 00～16 點）：每 30 分鐘一次當接力備援
    - cron: '*/30 0-16 * * *'
    # 夜間（台北 01:00～07:59）每 4 小時掃一次：01:00、05:00，再加 07:30 讓早上 9 點前資料是新的
    - cron: '0 17,21 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      tw:
        description: '強制掃台股（1 = 要）'
        default: '0'
      test:
        description: '送一則測試訊息（1 = 要）'
        default: '1'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write   # 數據記錄要推回 data 分支
      actions: write    # 讓這一輪在中途先排好「下一輪」，輪與輪之間不留空窗
    # GitHub 的定時排程不準（實測約每小時才起一次），所以仍用自我接力維持間隔，但 2026-11-14 起為了降低被視為濫用的風險而減量：
    #   1. 每一輪只掃「一次」（白天目標間隔 30 分鐘，原本 15 分鐘），掃完等到下一次掃描時間，才用 workflow_dispatch 排下一輪並結束（不再同一輪連掃多次）；
    #   2. 夜間（台北 01:00～07:59）掃一次就結束、不接力，由定時排程 01:00／05:00／07:30 各叫一次；
    #   3. 定時排程（每 30 分鐘）只當備援：萬一接力斷掉，最慢下次排程時重新接上。
    # workflow_dispatch 事件即使用 GITHUB_TOKEN 發出也一定會建立新的 run（GitHub 官方文件）。
    concurrency:
      group: alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: |
          # 2026-11-08 搬遷：所有運算都在這裡跑（網站 Cloudflare 只讀結果）。每輪：警報 → 數據記錄 → 策略記錄 → 快照
          # 2026-11-14 減量：每輪只掃一次。白天等到「這一輪開始後 INT_DAY 秒」才排下一輪（掃描本身約 8～9 分鐘，其餘是等待）；夜間不接力
          INT_DAY="${INT_DAY:-1800}"
          T0=$(date +%s)
          TEST="$TEST_IN" TW="$TW_IN" timeout 600 node scripts/alert.mjs || true
          timeout 300 node scripts/log.mjs || true
          timeout 400 node scripts/slog.mjs || true
          # 快照（加密一定跑；台股依時段／過期自動決定，也可手動 TW=1）
          TW="$TW_IN" timeout 1200 node scripts/snapshot.mjs || true
          ELAPSED=$(( $(date +%s) - T0 ))
          echo "這一輪掃描花 ${ELAPSED} 秒"
          # 台北時間 01:00～07:59 網站沒人看、也不推播：掃一次就結束，不排下一輪（下一次由定時排程叫起）
          H=$(TZ=Asia/Taipei date +%-H)
          if [ "$H" -ge 1 ] && [ "$H" -lt 8 ]; then echo "夜間：不接力"; exit 0; fi
          WAIT=$(( INT_DAY - ELAPSED )); [ "$WAIT" -lt 0 ] && WAIT=0
          [ "$WAIT" -gt 0 ] && sleep "$WAIT"
          # test=0：不要送測試訊息。排進 concurrency 佇列，這一輪結束（只差存快取的幾秒）就接上
          if gh workflow run alert.yml --ref "$GITHUB_REF_NAME" -f test=0 -f tw=0; then echo "已排好下一輪"; else echo "::warning::排下一輪失敗，靠定時排程備援"; fi
        env:
          SNAPSHOT: '1'
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          SITE: ${{ vars.SITE }}
          TW_IN: ${{ github.event.inputs.tw }}
          TEST_IN: ${{ github.event.inputs.test }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
