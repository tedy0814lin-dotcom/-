name: 全台股型態快照
on:
  schedule:
    # 台北 14:10～17:40 每 30 分鐘（UTC 06:10～09:40）週一～週五：收盤後盡快算全部台股（含大單推升的頂背離標記，選股頁與策略記錄要用）。
    # 資料還沒更新到當天時 patall 自己的 asof 檢查會讓標記保持「非最新」而不被採用，重複跑沒有副作用；週六 10:00 再補一次
    - cron: '10,40 6-9 * * 1-5'
    - cron: '0 2 * * 6'
  workflow_dispatch:
jobs:
  patall:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: patall
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: timeout 3000 node scripts/patall.mjs
        env:
          SNAPSHOT: '1'
          GITHUB_TOKEN: ${{ github.token }}
