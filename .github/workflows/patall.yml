name: 全台股型態快照
on:
  schedule:
    # 台北 13:30 與 14:00（UTC 05:30、06:00）週一～週五：收盤後各算一次全部台股（含大單推升的頂背離標記，選股頁與策略記錄要用）。
    # 13:30 剛收盤，資料可能還沒更新到當天；那時標記日期對不上最新交易日，頁面不採用，等 14:00 這次。週六 10:00 再補一次
    - cron: '30 5 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 2 * * 6'
  workflow_dispatch:
jobs:
  patall:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: patall
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: timeout 3000 node scripts/patall.mjs
        env:
          SNAPSHOT: '1'
          GITHUB_TOKEN: ${{ github.token }}
