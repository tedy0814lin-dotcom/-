name: 投信歷史資料
on:
  schedule:
    - cron: '30 10 * * 1-5'   # 台灣時間每個工作日 18:30（證交所 16:00 後公布）
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      contents: write
    concurrency:
      group: trusthist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/trusthist.mjs
        env:
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
